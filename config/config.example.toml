# ---- Now playing (pick ONE source named "music", or change [wall] now_playing) ---------------------
#
# Spotify, one-time setup (about 5 minutes, on a PC with a browser, NOT inside the container):
#   1. https://developer.spotify.com/dashboard -> Create app. Any name; Redirect URI exactly
#        http://127.0.0.1:8888/callback
#      tick "Web API", save. Settings -> copy the Client ID and Client Secret. While the app is in
#      Development mode, add your own Spotify account under User Management.
#   2. From the repo root:   python scripts/spotify_auth.py --client-id <your client id>
#      (it prompts for the secret; standard library only). Approve in the browser that opens.
#   3. Paste the three SPOTIFY_* lines it prints into config/secrets.toml, enable the source below
#      (and delete the demo "music" source above), then:  docker compose up -d
# [[source]]
# name = "music"
# type = "spotify"
# client_id = "${SPOTIFY_CLIENT_ID}"
# client_secret = "${SPOTIFY_CLIENT_SECRET}"
# refresh_token = "${SPOTIFY_REFRESH_TOKEN}"
# # every = "5s"                  # poll while playing
# # idle_every = "30s"            # poll while paused / idle

# Last.fm: any player that scrobbles. API key from https://www.last.fm/api/account/create
# (LASTFM_API_KEY in secrets.toml). No progress bar: Last.fm only knows "now playing".
# [[source]]
# name = "music"
# type = "lastfm"
# api_key = "${LASTFM_API_KEY}"
# user = "your-lastfm-username"
# # every = "15s"

# Push: any player or script POSTs the track (see SOURCES.md), e.g. on Windows for ANY local player:
#   uv run --with winsdk scripts/nowplaying_windows.py --wall http://<box>:8700
# or by hand:
#   curl -X POST http://<box>:8700/api/publish/music -H "Content-Type: application/json" \
#        -d '{"key":"now","value":{"title":"Teardrop","artist":"Massive Attack","is_playing":true}}'
# [[source]]
# name = "music"
# type = "push"
# ttl = "1m"                      # a player that stops pushing disappears after this

# Pushed in by phones, other boxes, scripts:  POST /api/publish/phone  {"key": "battery", "value": 81}
# [[source]]
# name = "phone"
# type = "push"
# ttl = "30m"
# visibility = "ask"


# =====================================================================================================
# Rules: derived signals (source "rules"). Every table is optional. Keys every rule accepts:
#   enabled = false          turn it off
#   every = "30s"            how often it re-runs on its own (it also runs whenever an input changes)
#   ttl = "90s"              how long its outputs stay fresh (default 3 x every)
#   inputs = ["envcan.*"]    which changed signals re-run it (override when you rename a source)
# =====================================================================================================

[rules.heartbeat_down]
after = "2m"                      # no successful ping for this long = down
# hosts = ["homelab", "main-pc"]  # hosts that never report go down after `after` too

[rules.finance_mood]
drift_ratio = 0.85                # spent/income above this = drift
warning_ratio = 1.0               # above this (or net < 0) = warning
# pace_tolerance = 0.15

[rules.weather_actionable]
# observed = "ec"                 # a source of station observations (envcanada): rain it reports = "Raining now"
precip_window = "60m"             # "Rain in 20 min" only within this window
cold_c = -15                      # feels-like at or below = "dress for it"
# hot_c = 30

[rules.leave_early]
# observed = "ec"                 # likewise
lead = "60m"                      # event with a location starting within this...
around = "30m"                    # ...and precipitation by its start + this = "Leave early"

[rules.news]                      # rank, dedupe and flag headlines from every news*.items feed
max_age = "12h"                   # older items are dropped
keep = 5                          # length of rules.news.top
local_terms = ["Ottawa", "Gatineau"]   # place names that rank a headline up (default: none)
critical_priority = 10            # a source with priority >= this is always critical
rotate_top = 3                    # the wall rotates through the top 3 headlines...
rotate_s = 60                     # ...one every 60 s (a critical headline is pinned instead)
# inputs = ["news*.items"]        # which feeds count
# dedupe_threshold = 0.75         # title similarity at which two headlines are the same story
# critical_max_age = "3h"         # an older item is never critical
# critical_terms = ["warning", "evacuation", "evacuate", "emergency", "tornado", "lockdown",
#                   "boil water", "state of emergency", "amber alert", "shelter in place", "hold and secure"]


# =====================================================================================================
# Wall bindings: which pool signals feed which wall element. These are the defaults; change them when
# a source has a different name (e.g. weather = "home-wx" -> weather_condition = "home-wx.now.condition").
# =====================================================================================================

[wall]
calendar = "calendar.next"
heartbeat = "rules.heartbeat.*"
finances = "finances.month"
finance_mood = "rules.finances.mood"
weather_temp = "weather.now.temp_c"
weather_actionable = "rules.weather.actionable"
weather_condition = "weather.now.condition"     # clear|cloudy|fog|rain|storm|snow
weather_intensity = "weather.now.intensity"     # 0..1
weather_wind = "weather.now.wind_kph"
# weather_obs_condition = "ec.now.condition"    # station observations (an envcanada source named "ec", with
# weather_obs_intensity = "ec.now.intensity"    #   ttl = "90m"): precipitation they report wins over the
#                                               #   forecast model's "now", which can miss rain that is falling
calendar_advice = "rules.calendar.advice"       # "Leave early" replaces the weather sliver; "" = off
heartbeat_raw = "heartbeat.host.*"              # raw probes, for hosts the rule hasn't covered yet
news = "rules.news.top"                         # ranked headlines from [rules.news]; "" = off
now_playing = "music.now"                       # current track (spotify / lastfm / push / demo); "" = off
now_playing_idle = "2m"                         # paused longer than this = hidden


# =====================================================================================================
# Ask panels: shown briefly on request (POST /api/show/<panel>, later voice). Defaults shown; an input
# set to "" is off. Any panel also takes enabled = false and title = "...". Panels may read ask-only
# signals (that is their purpose); the wall never does.
# =====================================================================================================

[ask.forecast]
daily = "weather.forecast.daily"
days = 7

[ask.calendar]
today = "calendar.today"

[ask.pulse]
pulse = "github.pulse"
repos = "github.repo.*"          # fallback when pulse is missing
dormant_days = 30                # only used when the source gives no alive/dormant flag

[ask.finance]
month = "finances.month"
detail = "finances.detail.*"     # detail.expenses -> kind "expense", detail.income -> "income"
mood = "rules.finances.mood"

[ask.news]
top = "rules.news.top"
max_items = 5

[ask.warnings]
warnings = "weather.warnings"
