# Ambient Wall configuration (example). Runs as-is with zero secrets: every element is fed by the
# offline `demo` source so all themes light up end to end.
#
# To make it yours: copy to config/config.toml (gitignored), then swap the demo sources for real ones
# (commented examples below). Secrets go in config/secrets.toml (gitignored, flat table):
#
#     PUSH_TOKEN = "long-random-string"
#     CALENDAR_ICS_URL = "https://calendar.google.com/calendar/ical/.../basic.ics"
#
# and are referenced here as "${NAME}" (secrets.toml first, then environment variables). A source
# whose ${NAME} is not set is disabled with a warning; the rest of the wall keeps running.
# Durations: "250ms", "30s", "5m", "1h", "2d" or a bare number of seconds.
# In the container, relative paths mean /data (the wall-data volume).

[server]
host = "0.0.0.0"                  # in-container bind; change the published port in compose.yaml
port = 8700
# push_token = "${PUSH_TOKEN}"    # if set, POST /api/publish/<source> needs  Authorization: Bearer <token>
                                  # (if set but the secret is missing, pushes are refused, not opened)
# max_body_bytes = 65536          # push body limit
# allowed_origins = ["null"]      # extra browser origins allowed on the WebSocket. The wall page served
                                  # by this box (http://<box>:8700/) is always allowed. Add "null" to use
                                  # the single-file build (frontend/dist/ambient-wall.html opened from
                                  # disk, which sends Origin: null), or e.g. "http://192.168.1.20:8765"
                                  # for a frontend served elsewhere. Any web page in a LAN browser could
                                  # otherwise read the wall, so keep this list short.

[location]                        # used for daylight (browser), weather, and local time everywhere
name = "Ottawa"                   # your town (shown on the wall); lat / lon in decimal degrees
lat = 45.4215
lon = -75.6972
timezone = "America/Toronto"      # IANA name, e.g. Europe/London, America/Los_Angeles

[mode]                            # sent to the browser in the WebSocket "hello"
work_start = "07:00"
work_end = "17:00"
work_days = [1, 2, 3, 4, 5]       # 0 = Sunday ... 6 = Saturday (JS getDay)
transition_seconds = 8            # the "exhale" between work and ambient

[display]
theme = "cyberpunk"               # cyberpunk | nature | classical | boreal | campfire | academia |
                                  # stainedglass | lofi | orbit | tower
hour24 = true
sound = false                     # ambient sound on at startup (change live: POST /api/command set_sound)
volume = 0.4                      # 0..1, ambient mode
sound_work = 0.0                  # 0..1 volume during work mode (0 = silent while working)
boost = 0                         # projector boost for a dim projector: 0 off, 1 low, 2 medium, 3 high
                                  # (lifts near-black tones, true black stays black; G on the wall cycles it)
cat = false                       # a cat in every scene (K on the wall toggles; POST /api/command set_cat)
cat_coat = "tabby"                # tabby ginger black grey tuxedo calico siamese white (Shift+K on the wall cycles)

[history]
keep = "14d"                      # SQLite history of changes in /data/history.db, pruned past this age


# =====================================================================================================
# Sources: one [[source]] table per instance. `name` becomes the signal namespace ("<name>.<key>"),
# `type` picks the adapter. Common keys every source accepts:
#   every = "30s"        how often to fetch (adapter default otherwise)
#   ttl = "5m"           how long a value stays fresh (default: 3 x every)
#   visibility = "wall"  "wall" (eligible to glow) or "ask" (pool only)
#   enabled = true
# =====================================================================================================

# ---- demo: offline stand-in for every wall element (mirrors the frontend mocks) and every ask panel
# (forecast, calendar, pulse, finance, news, warnings). One instance per element so the default [wall]
# bindings below match. Each emits the same keys as the real adapter it stands in for. Delete these
# once real sources are configured.
[[source]]
name = "calendar"
type = "demo"
# calendar = true                 # false = no events at all (next null, no today list)
# calendar_lead_min = 47          # first event starts this many minutes after startup

[[source]]
name = "heartbeat"
type = "demo"
# homelab_down = false            # true = homelab has been down for 4 min

[[source]]
name = "finances"
type = "demo"
# finance = "calm"                # calm | drift | warning (also sets the detail.expenses categories)

[[source]]
name = "weather"
type = "demo"
weather = "overcast"              # overcast|clear|partly|fog|drizzle|rain|storm|snow|cold|cycle
# cycle_every = "60s"             # with weather = "cycle": step through the presets
# warnings = false                # true = one active weather warning (the warnings ask panel)

[[source]]                        # headlines from two mock feeds; name starts with "news" so the
name = "news"                     # news rule's default input glob (news*.items) picks it up
type = "demo"
# news = "normal"                 # normal | critical (adds a tornado-warning headline) | none (empty)

[[source]]                        # project pulse for 3 mock repos, same keys as type = "github"
name = "github"
type = "demo"
parts = ["pulse"]

[[source]]                        # now playing: a 6-track mock playlist (progress advances, one 90 s
name = "music"                    # pause), same `now` key as type = "spotify". Replace with a real
type = "demo"                     # music source below.
# music = "playlist"              # playlist | none (nothing playing)


