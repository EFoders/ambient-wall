[pytest]
testpaths = tests
# A stuck page (an audio decode or a page.evaluate that never settles) must fail, not hang the suite for hours.
# Needs the pytest-timeout plugin: run with  uv run --with pytest --with pytest-timeout --with playwright ...
# The "thread" method works on Windows (no SIGALRM) and dumps every thread's stack on a timeout.
timeout = 300
timeout_method = thread
