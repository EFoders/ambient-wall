[project]
name = "ambient-wall"
version = "0.2.0"
description = "Ambient Wall backend: source adapters -> signal pool -> rules -> wall projection -> WebSocket"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "icalendar>=5.0",
    "recurring-ical-events>=2.2",
    "tzdata>=2026.5",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
google = ["google-auth>=2.30"]

[project.scripts]
ambient = "ambient.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ambient"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
